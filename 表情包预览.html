<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下水道河童打工人 · 表情包预览</title>
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #1f2429;
    --sub: #7b8794;
    --accent: #2f9e6e;
    --line: #e2e7ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 64px;
    background:
      radial-gradient(1200px 500px at 50% -10%, #d9f0e4 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    max-width: 1080px;
    margin: 0 auto 32px;
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    letter-spacing: 1px;
  }
  .subtitle {
    margin: 0;
    color: var(--sub);
    font-size: 14px;
    line-height: 1.7;
  }
  .meta {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .tag {
    padding: 6px 12px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--sub);
  }
  .tag b { color: var(--accent); }
  .grid {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 16px 12px;
    text-align: center;
    cursor: zoom-in;
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    box-shadow: 0 2px 6px rgba(31, 36, 41, .04);
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: #b9e2cd;
    box-shadow: 0 14px 28px rgba(47, 158, 110, .16);
  }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-conic-gradient(#f7f9fa 0% 25%, #fff 0% 50%) 50% / 20px 20px;
    border-radius: 12px;
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
  }
  .label {
    margin-top: 12px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .file {
    margin-top: 4px;
    font-size: 11px;
    color: var(--sub);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  footer {
    max-width: 1080px;
    margin: 44px auto 0;
    padding-top: 20px;
    border-top: 1px dashed var(--line);
    color: var(--sub);
    font-size: 12.5px;
    line-height: 1.9;
    text-align: center;
  }
  /* 灯箱 */
  .lightbox {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    background: rgba(20, 26, 30, .82);
    backdrop-filter: blur(6px);
    z-index: 100;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    width: min(72vmin, 480px);
    height: min(72vmin, 480px);
    object-fit: contain;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }
  .lightbox .lb-label {
    color: #fff;
    font-size: 18px;
    letter-spacing: 1px;
  }
  .lightbox .lb-hint {
    color: rgba(255, 255, 255, .55);
    font-size: 12px;
  }
  @media (max-width: 480px) {
    h1 { font-size: 23px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 10px 10px 8px; }
    .label { font-size: 14px; }
  }
</style>
</head>
<body>
  <header>
    <h1>下水道河童打工人</h1>
    <p class="subtitle">微信表情包 · 16 张静态表情预览<br>点击任意一张可放大查看</p>
    <div class="meta">
      <span class="tag">规格 <b>240 × 240</b></span>
      <span class="tag">格式 <b>GIF</b></span>
      <span class="tag">单张 <b>≤ 60KB</b></span>
      <span class="tag">数量 <b>16 张</b></span>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    上架入口：sticker.weixin.qq.com（微信表情开放平台） · 个人账号注册 → 实名认证 → 提交表情专辑<br>
    本页仅用于本地预览，图片路径为相对路径 kappa_stickers/final/
  </footer>

  <div class="lightbox" id="lightbox">
    <img id="lbImg" src="" alt="">
    <div class="lb-label" id="lbLabel"></div>
    <div class="lb-hint">点击任意处关闭</div>
  </div>

<script>
  const DATA = [
    ["01_shoudao.gif", "收到"],
    ["02_haode.gif", "好的"],
    ["03_zaimang.gif", "在忙了"],
    ["04_mashang.gif", "马上来"],
    ["05_zhouyi.gif", "周一"],
    ["06_xiaban.gif", "下班啦"],
    ["07_jiaban.gif", "加班中"],
    ["08_qiujiaxin.gif", "求加薪"],
    ["09_leile.gif", "累了"],
    ["10_buxiangshangban.gif", "不想上班"],
    ["11_moyu.gif", "摸鱼中"],
    ["12_xiexielaoban.gif", "谢谢老板"],
    ["13_youkaihui.gif", "又开会"],
    ["14_dagongren.gif", "打工人"],
    ["15_biecuile.gif", "别催了"],
    ["16_wanan.gif", "晚安"]
  ];

  const BASE = "kappa_stickers/final/";
  const grid = document.getElementById("grid");
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbLabel = document.getElementById("lbLabel");

  DATA.forEach(([file, label]) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="thumb"><img src="' + BASE + file + '" alt="' + label + '" loading="lazy"></div>' +
      '<div class="label">' + label + '</div>' +
      '<div class="file">' + file + '</div>';
    card.addEventListener("click", () => {
      lbImg.src = BASE + file;
      lbLabel.textContent = label + " · " + file;
      lightbox.classList.add("open");
    });
    grid.appendChild(card);
  });

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("open");
    lbImg.src = "";
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { lightbox.classList.remove("open"); lbImg.src = ""; }
  });
</script>
</body>
</html>
