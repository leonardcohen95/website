{% extends 'questions/base.html' %}

{% block title_key %}admin{% endblock %}

{% block content %}
    <div class="container-fluid">
        <!-- 页面头部 -->
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="text-primary">
                    <i class="bi bi-pencil me-2"></i><span data-i18n="aq.title_edit">编辑题目</span>
                </h1>
                <p class="text-muted" data-i18n="aq.sub_edit">修改题目的详细信息</p>
            </div>
            <div>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-4 py-2 rounded-pill shadow">
                    <i class="bi bi-arrow-left me-2"></i><span data-i18n="common.back_home">返回首页</span>
                </a>
            </div>
        </div>

        <!-- 编辑题目表单 -->
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-light">
                        <h3 class="card-title mb-0" data-i18n="aq.info">题目信息</h3>
                    </div>
                    <div class="card-body p-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} mb-4">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <form action="{% url 'edit_question' question.id %}" method="POST">
                            {% csrf_token %}
                            
                            <!-- 题目类型 -->
                            <div class="mb-4">
                                <label for="type" class="form-label" data-i18n="form.type">题目类型</label>
                                <select class="form-select form-select-lg rounded-3 shadow-sm" id="type" name="type" required>
                                    <option value="选择题" {% if question.type == '选择题' %}selected{% endif %} data-i18n="type.choice">选择题</option>
                                    <option value="简答题" {% if question.type == '简答题' %}selected{% endif %} data-i18n="type.short">简答题</option>
                                </select>
                            </div>
                            
                            <!-- 题目内容 -->
                            <div class="mb-4">
                                <label for="question" class="form-label" data-i18n="form.question">题目内容</label>
                                <textarea class="form-control form-control-lg rounded-3 shadow-sm" id="question" name="question" rows="3" data-i18n-ph="form.question_ph" placeholder="请输入题目内容" required>{{ question.question }}</textarea>
                            </div>
                            
                            <!-- 选项区域（仅选择题显示） -->
                            <div id="options_section" class="mb-4" {% if question.type != '选择题' %}style="display: none;"{% endif %}>
                                <h5 class="text-dark fw-semibold mb-3" data-i18n="form.options">选项</h5>
                                <div class="space-y-3">
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">A</span>
                                        <input type="text" class="form-control form-control-lg rounded-3 shadow-sm" name="option1" data-i18n-ph="form.option_ph" data-i18n-args='{"x":"A"}' placeholder="请输入选项A" value="{% if question.options.0 %}{{ question.options.0 }}{% endif %}" required>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">B</span>
                                        <input type="text" class="form-control form-control-lg rounded-3 shadow-sm" name="option2" data-i18n-ph="form.option_ph" data-i18n-args='{"x":"B"}' placeholder="请输入选项B" value="{% if question.options.1 %}{{ question.options.1 }}{% endif %}" required>
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">C</span>
                                        <input type="text" class="form-control form-control-lg rounded-3 shadow-sm" name="option3" data-i18n-ph="form.option_ph" data-i18n-args='{"x":"C"}' placeholder="请输入选项C" value="{% if question.options.2 %}{{ question.options.2 }}{% endif %}">
                                    </div>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">D</span>
                                        <input type="text" class="form-control form-control-lg rounded-3 shadow-sm" name="option4" data-i18n-ph="form.option_ph" data-i18n-args='{"x":"D"}' placeholder="请输入选项D" value="{% if question.options.3 %}{{ question.options.3 }}{% endif %}">
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 正确答案 -->
                            <div class="mb-4">
                                <label for="answer" class="form-label" data-i18n="form.answer">正确答案</label>
                                <input type="text" class="form-control form-control-lg rounded-3 shadow-sm" id="answer" name="answer" data-i18n-ph="form.answer_ph" placeholder="请输入正确答案" value="{{ question.answer }}" required>
                                <small class="text-muted mt-1 d-block" data-i18n="form.answer_tip">提示：选择题请输入选项字母（如A、B、C、D），简答题请输入具体答案</small>
                            </div>
                            
                            <!-- 答案解析 -->
                            <div class="mb-5">
                                <label for="analysis" class="form-label" data-i18n="form.analysis">答案解析</label>
                                <textarea class="form-control form-control-lg rounded-3 shadow-sm" id="analysis" name="analysis" rows="4" data-i18n-ph="form.analysis_ph" placeholder="请输入答案解析" required>{{ question.analysis }}</textarea>
                            </div>
                            
                            <!-- 操作按钮 -->
                            <div class="d-flex justify-content-end gap-3">
                                <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-5 py-2 rounded-pill shadow">
                                    <i class="bi bi-x-circle me-2"></i><span data-i18n="common.cancel">取消</span>
                                </a>
                                <button type="submit" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow">
                                    <i class="bi bi-check-circle me-2"></i><span data-i18n="common.save_changes">保存修改</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 监听题目类型变化，显示/隐藏选项区域
        document.getElementById('type').addEventListener('change', function() {
            const optionsSection = document.getElementById('options_section');
            const optionInputs = optionsSection.querySelectorAll('input[name^="option"]');
            
            if (this.value === '选择题') {
                optionsSection.style.display = 'block';
                // 设置前两个选项为必填
                optionInputs[0].required = true;
                optionInputs[1].required = true;
            } else {
                optionsSection.style.display = 'none';
                // 移除必填属性
                optionInputs.forEach(input => input.required = false);
            }
        });
    </script>
{% endblock %}
