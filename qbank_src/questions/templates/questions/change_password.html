{% extends 'questions/base.html' %}

{% block title_key %}admin{% endblock %}

{% block content %}
    <div class="container-fluid">
        <!-- 页面头部 -->
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="text-primary">
                    <i class="bi bi-person-gear me-2"></i><span data-i18n="cp.title">修改密码</span>
                </h1>
                <p class="text-muted" data-i18n="cp.subtitle">更新管理员密码</p>
            </div>
            <div>
                <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-4 py-2 rounded-pill shadow">
                    <i class="bi bi-arrow-left me-2"></i><span data-i18n="common.back_home">返回首页</span>
                </a>
            </div>
        </div>

        <!-- 修改密码表单 -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-light">
                        <h3 class="card-title mb-0" data-i18n="cp.info">密码信息</h3>
                    </div>
                    <div class="card-body p-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} mb-4">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <form action="{% url 'change_password' %}" method="POST">
                            {% csrf_token %}
                            
                            <!-- 当前密码 -->
                            <div class="mb-4">
                                <label for="current_password" class="form-label" data-i18n="cp.current">当前密码</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control form-control-lg rounded-3 shadow-sm" id="current_password" name="current_password" data-i18n-ph="cp.current_ph" placeholder="请输入当前密码" required>
                                </div>
                            </div>
                            
                            <!-- 新密码 -->
                            <div class="mb-4">
                                <label for="new_password" class="form-label" data-i18n="cp.new">新密码</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control form-control-lg rounded-3 shadow-sm" id="new_password" name="new_password" data-i18n-ph="cp.new_ph" placeholder="请输入新密码" required>
                                </div>
                                <small class="text-muted mt-1 d-block" data-i18n="cp.new_tip">密码长度不能少于6个字符</small>
                            </div>
                            
                            <!-- 确认新密码 -->
                            <div class="mb-5">
                                <label for="confirm_password" class="form-label" data-i18n="cp.confirm">确认新密码</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control form-control-lg rounded-3 shadow-sm" id="confirm_password" name="confirm_password" data-i18n-ph="cp.confirm_ph" placeholder="请再次输入新密码" required>
                                </div>
                            </div>
                            
                            <!-- 操作按钮 -->
                            <div class="d-flex justify-content-end gap-3">
                                <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary btn-lg px-5 py-2 rounded-pill shadow">
                                    <i class="bi bi-x-circle me-2"></i><span data-i18n="common.cancel">取消</span>
                                </a>
                                <button type="submit" class="btn btn-primary btn-lg px-5 py-2 rounded-pill shadow">
                                    <i class="bi bi-check-circle me-2"></i><span data-i18n="common.save_changes">保存修改</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
