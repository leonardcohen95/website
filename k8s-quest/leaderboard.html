<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>排行榜 | K8s Quest</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="leaderboard">

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand-logo">☸️</span><span>K8s Quest</span>
      </a>
      <div class="nav-right" id="top-nav-right"></div>
    </div>
  </header>

  <section class="section">
    <h2 class="section-title">🏆 排行榜</h2>
    <p class="section-sub">看看你在 K8s 学习者中的排名！继续答题，冲上榜单！</p>

    <div class="container" style="max-width: 700px;">
      <div id="leaderboard-list" class="leaderboard-list"></div>

      <div style="text-align:center; margin-top: 32px; padding: 20px; background: var(--color-surface); border-radius: var(--radius-md); border: 1px dashed var(--color-border);">
        <p style="color: var(--color-text-light); font-size: 0.9rem;">
          💡 当前为本地排行榜（MVP 阶段）<br/>
          后端上线后将展示全球学习者的真实排名
        </p>
        <a href="index.html" style="display:inline-block; margin-top:12px; padding:10px 24px; background:var(--color-primary); color:#fff; border-radius:var(--radius-sm); font-weight:600;">🚀 去答题赚星星</a>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>K8s Quest · 排行榜</p>
  </footer>

  <script src="assets/js/game.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const data = GameSystem.load();
      const myStars = data.stars;
      const myTitle = GameSystem.getCurrentTitle(myStars);

      // 模拟其他玩家数据（MVP 阶段）
      const mockPlayers = [
        { name: "云原生老王", stars: 380, title: "K8s 架构师" },
        { name: "DevOps小李", stars: 320, title: "包管理专家" },
        { name: "容器达人", stars: 280, title: "调度大师" },
        { name: "运维阿强", stars: 220, title: "安全卫士" },
        { name: "K8s新手村", stars: 180, title: "存储管理员" },
        { name: "微服务玩家", stars: 140, title: "网络工程师" },
        { name: "Pod驾驶员", stars: 90, title: "部署工程师" },
        { name: "容器学徒007", stars: 50, title: "Pod 驾驶员" },
        { name: "学习中ing", stars: 20, title: "容器学徒" },
      ];

      // 把当前用户加入排行榜
      const allPlayers = [
        ...mockPlayers,
        { name: data.userName + "（我）", stars: myStars, title: myTitle.name, isMe: true }
      ];

      // 按星星排序
      allPlayers.sort((a, b) => b.stars - a.stars);

      const list = document.getElementById("leaderboard-list");
      list.innerHTML = allPlayers.map((p, i) => {
        const rankClass = i < 3 ? `rank-${i + 1}` : "";
        const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
        return `<div class="rank-item ${rankClass}">
          <div class="rank-num">${medal}</div>
          <div class="rank-info">
            <div class="rank-name">${p.name}${p.isMe ? ' 👈' : ''}</div>
            <div class="rank-title">${p.title}</div>
          </div>
          <div class="rank-stars">⭐ ${p.stars}</div>
        </div>`;
      }).join("");
    });
  </script>
</body>
</html>
